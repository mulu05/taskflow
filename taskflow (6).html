<title>TaskFlow</title>
<style>
  :root{
    --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--border:#2e2e2e;
    --text:#f0f0f0;--text-sub:#888;--text-muted:#555;
    --accent:#7c6fff;--accent-bg:rgba(124,111,255,.12);
    --green:#3ecf8e;--green-bg:rgba(62,207,142,.12);
    --amber:#f5a623;--amber-bg:rgba(245,166,35,.12);
    --red:#f06060;--red-bg:rgba(240,96,96,.1);
    --teal:#2dd4bf;--teal-bg:rgba(45,212,191,.12);
    --radius:12px;--radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;min-height:100dvh;}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10;}
  .nav-title{font-size:17px;font-weight:600;letter-spacing:-.3px;}
  .nav-tabs{display:flex;gap:3px;background:var(--surface);padding:3px;border-radius:10px;}
  .nav-tab{font-size:11px;padding:5px 10px;border-radius:7px;border:none;background:transparent;color:var(--text-sub);cursor:pointer;transition:all .15s;white-space:nowrap;}
  .nav-tab.active{background:var(--surface2);color:var(--text);}
  .main{padding:0 16px 100px;max-width:480px;margin:0 auto;}

  /* CALENDAR GRID */
  .heatmap-section{padding:16px 0 12px;}
  .section-label{font-size:11px;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
  .cal-grid{width:100%;}
  .cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
  .cal-dow-cell{text-align:center;font-size:10px;color:var(--text-muted);padding:2px 0;}
  .cal-dow-cell.sun{color:#f06060;}
  .cal-dow-cell.sat{color:#7c6fff;}
  .cal-weeks{display:flex;flex-direction:column;gap:2px;}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted);cursor:pointer;position:relative;background:transparent;transition:background .1s;}
  .cal-cell:hover{background:var(--surface2);}
  .cal-cell.other-month{opacity:0;}
  .cal-cell.has-log{background:var(--surface);}
  .cal-cell.lv1{background:rgba(124,111,255,.2);}
  .cal-cell.lv2{background:rgba(124,111,255,.45);}
  .cal-cell.lv3{background:rgba(124,111,255,.7);}
  .cal-cell.lv4{background:#7c6fff;color:#fff;}
  .cal-cell.hlv1{background:rgba(45,212,191,.2);}
  .cal-cell.hlv2{background:rgba(45,212,191,.45);}
  .cal-cell.hlv3{background:rgba(45,212,191,.7);}
  .cal-cell.hlv4{background:#2dd4bf;color:#0f0f0f;}
  .cal-cell.missed{background:rgba(240,96,96,.25);color:var(--red);}
  .cal-cell.today-cell{font-weight:700;}
  .cal-cell.today-cell::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--teal);}
  .cal-cell.sun-cell{color:#f06060;}
  .cal-cell.sat-cell{color:#7c6fff;}
  .heatmap-legend{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:10px;color:var(--text-muted);flex-wrap:wrap;}
  .heatmap-legend-cell{width:10px;height:10px;border-radius:2px;}

  /* SORT BAR */
  .sort-bar{display:flex;gap:6px;padding:8px 0 14px;overflow-x:auto;scrollbar-width:none;}
  .sort-bar::-webkit-scrollbar{display:none;}
  .sort-btn{flex-shrink:0;font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-sub);cursor:pointer;transition:all .15s;white-space:nowrap;}
  .sort-btn.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);}

  /* TASK CARDS */
  .cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:border-color .15s,transform .1s;position:relative;}
  .task-card:active{transform:scale(.98);}
  .task-card:hover{border-color:var(--accent);}
  .card-stars{font-size:10px;color:var(--amber);margin-bottom:6px;letter-spacing:1px;}
  .card-title{font-size:14px;font-weight:500;line-height:1.3;margin-bottom:8px;word-break:break-all;}
  .card-dates{font-size:10px;color:var(--text-sub);margin-bottom:10px;}
  .card-progress-bg{background:var(--surface2);border-radius:3px;height:4px;margin-bottom:5px;}
  .card-progress-fill{height:100%;border-radius:3px;transition:width .3s;}
  .card-progress-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);}
  .status-dot{width:6px;height:6px;border-radius:50%;position:absolute;top:12px;right:12px;}
  .status-dot.not-started{background:var(--text-muted);}
  .status-dot.in-progress{background:var(--accent);}
  .status-dot.done{background:var(--green);}

  /* HABIT CARDS */
  .habit-list{display:flex;flex-direction:column;gap:10px;padding-top:8px;}
  .habit-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s;}
  .habit-card:hover{border-color:var(--teal);}
  .habit-card.done-today{border-color:rgba(45,212,191,.4);}
  .habit-card.started{border-color:var(--amber);background:rgba(245,166,35,.05);}
  .habit-icon{font-size:26px;flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border-radius:10px;}
  .habit-info{flex:1;min-width:0;}
  .habit-name{font-size:14px;font-weight:500;margin-bottom:2px;}
  .habit-meta{font-size:10px;color:var(--text-muted);margin-bottom:4px;}
  .habit-streak{font-size:11px;color:var(--amber);}
  .habit-check-area{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
  .habit-today-val{font-size:13px;font-weight:500;color:var(--teal);}
  .habit-today-none{font-size:11px;color:var(--text-muted);}
  .habit-detail-btn{font-size:10px;background:var(--surface2);color:var(--text-sub);border:none;border-radius:6px;padding:3px 8px;cursor:pointer;}

  /* QUICK LOG */
  .quick-log-form{background:var(--surface2);border-radius:var(--radius-sm);padding:12px;margin-top:6px;display:none;flex-direction:column;gap:10px;}
  .quick-log-form.open{display:flex;}
  .ql-time-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .ql-time-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;font-family:inherit;}
  .ql-time-btn:active{transform:scale(.96);}
  .ql-time-btn.set{border-color:var(--teal);background:var(--teal-bg);}
  .ql-time-btn.set-end{border-color:var(--accent);background:var(--accent-bg);}
  .ql-time-btn-label{font-size:10px;color:var(--text-muted);}
  .ql-time-btn.set .ql-time-btn-label{color:var(--teal);}
  .ql-time-btn.set-end .ql-time-btn-label{color:var(--accent);}
  .ql-time-btn-val{font-size:15px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;}
  .ql-amount-row{display:flex;gap:8px;align-items:center;}
  .ql-amount-row.hidden{display:none;}
  .quick-log-input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:15px;font-family:inherit;outline:none;}
  .quick-log-input:focus{border-color:var(--teal);}
  .quick-log-unit{font-size:13px;color:var(--text-sub);white-space:nowrap;}
  .quick-log-memo{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;outline:none;resize:none;}
  .quick-log-memo:focus{border-color:var(--teal);}
  .quick-log-actions{display:flex;gap:6px;justify-content:flex-end;}

  /* FAB */
  .fab{position:fixed;bottom:28px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(124,111,255,.4);z-index:20;transition:transform .15s;}
  .fab:active{transform:scale(.93);}

  /* PANEL */
  .panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;}
  .panel-overlay.open{opacity:1;pointer-events:all;}
  .panel{position:fixed;bottom:0;left:0;right:0;max-height:92dvh;background:var(--surface);border-radius:20px 20px 0 0;z-index:31;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,20px);max-width:480px;margin:0 auto;}
  .panel.open{transform:translateY(0);}
  .panel-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;}
  .panel-inner{padding:16px 20px 32px;}
  .panel-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
  .panel-title-input{font-size:18px;font-weight:600;background:transparent;border:none;color:var(--text);width:100%;outline:none;line-height:1.3;}
  .panel-close{background:var(--surface2);border:none;color:var(--text-sub);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .field-group{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;}
  .field input,.field textarea,.field select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;width:100%;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);}
  .field textarea{resize:none;min-height:72px;}
  .field select option{background:var(--surface2);}
  .stars-input{display:flex;gap:4px;}
  .star-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);transition:color .1s;padding:0;line-height:1;}
  .star-btn.active{color:var(--amber);}
  .progress-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .progress-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;}
  .progress-slider{flex:1;accent-color:var(--accent);}
  .progress-val{font-size:13px;font-weight:500;color:var(--accent);min-width:34px;text-align:right;}
  .divider{border:none;border-top:1px solid var(--border);margin:16px 0;}

  /* TASK LOG */
  .log-section-title{font-size:12px;color:var(--text-sub);font-weight:500;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
  .log-add-btn{font-size:11px;background:var(--accent-bg);color:var(--accent);border:none;border-radius:6px;padding:3px 8px;cursor:pointer;font-family:inherit;}
  .log-item{background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;}
  .log-item-header{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .log-date-badge{font-size:11px;font-weight:500;color:var(--accent);background:var(--accent-bg);padding:2px 7px;border-radius:5px;}
  .log-time{font-size:11px;color:var(--text-sub);flex:1;}
  .log-delete-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;}
  .log-memo{font-size:12px;color:var(--text-sub);line-height:1.5;}
  .log-form{background:var(--surface2);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;display:flex;flex-direction:column;gap:10px;}
  .log-time-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .log-time-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-family:inherit;transition:all .15s;}
  .log-time-btn:active{transform:scale(.96);}
  .log-time-btn.set{border-color:var(--teal);background:var(--teal-bg);}
  .log-time-btn.set-end{border-color:var(--accent);background:var(--accent-bg);}
  .log-time-btn-label{font-size:10px;color:var(--text-muted);}
  .log-time-btn.set .log-time-btn-label{color:var(--teal);}
  .log-time-btn.set-end .log-time-btn-label{color:var(--accent);}
  .log-time-btn-val{font-size:15px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;}
  .log-form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .log-form input,.log-form textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit;outline:none;width:100%;}
  .log-form input:focus,.log-form textarea:focus{border-color:var(--accent);}
  .log-form textarea{resize:none;min-height:52px;}
  .log-form-actions{display:flex;gap:6px;justify-content:flex-end;}
  .btn-sm{font-size:12px;padding:5px 12px;border-radius:7px;border:1px solid var(--border);cursor:pointer;font-family:inherit;}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn-teal{background:var(--teal);color:#0f0f0f;border-color:var(--teal);font-weight:500;}
  .btn-ghost{background:transparent;color:var(--text-sub);}
  .panel-actions{display:flex;gap:8px;margin-top:16px;}
  .btn-archive{flex:1;font-size:13px;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--text-sub);cursor:pointer;font-family:inherit;}
  .btn-save{flex:2;font-size:13px;padding:10px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;cursor:pointer;font-weight:500;font-family:inherit;}
  .btn-save-teal{flex:2;font-size:13px;padding:10px;border-radius:var(--radius-sm);border:none;background:var(--teal);color:#0f0f0f;cursor:pointer;font-weight:500;font-family:inherit;}
  .btn-delete{font-size:13px;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--red-bg);background:transparent;color:var(--red);cursor:pointer;font-family:inherit;}

  /* EMOJI */
  .emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;}
  .emoji-opt{font-size:22px;border:none;background:var(--surface2);border-radius:8px;padding:6px;cursor:pointer;transition:background .1s;aspect-ratio:1;display:flex;align-items:center;justify-content:center;}
  .emoji-opt:hover,.emoji-opt.selected{background:var(--accent-bg);outline:1px solid var(--accent);}

  /* HABIT LOG */
  .habit-log-item{background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;}
  .habit-log-badge{font-size:11px;font-weight:500;color:var(--teal);background:var(--teal-bg);padding:2px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;}
  .habit-log-body{flex:1;}
  .habit-log-val{font-size:14px;font-weight:500;color:var(--text);}
  .habit-log-time{font-size:11px;color:var(--text-muted);}
  .habit-log-memo-text{font-size:11px;color:var(--text-muted);}

  /* EMPTY */
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
  .empty-state-icon{font-size:36px;margin-bottom:12px;}
  .empty-state p{font-size:14px;line-height:1.6;}

  /* ARCHIVE */
  .archive-list{padding:16px 0;}
  .archive-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;}
  .archive-item:hover{border-color:var(--accent);}
  .archive-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .archive-item-title{font-size:14px;font-weight:500;}
  .archive-badge{font-size:10px;background:var(--green-bg);color:var(--green);padding:2px 7px;border-radius:5px;}
  .archive-item-meta{font-size:11px;color:var(--text-sub);margin-bottom:6px;}
  .archive-item-memo{font-size:12px;color:var(--text-muted);line-height:1.5;}


  /* DAY POPUP */
  .day-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;align-items:flex-end;justify-content:center;}
  .day-popup-overlay.show{opacity:1;pointer-events:all;}
  .day-popup{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:70dvh;overflow-y:auto;transform:translateY(40px);transition:transform .25s;padding:0 0 32px;}
  .day-popup-overlay.show .day-popup{transform:translateY(0);}
  .day-popup-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;}
  .day-popup-inner{padding:14px 20px;}
  .day-popup-title{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--text);}
  .day-popup-section{font-size:10px;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;margin:10px 0 6px;}
  .day-popup-item{background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:6px;}
  .day-popup-item-title{font-size:13px;font-weight:500;margin-bottom:3px;}
  .day-popup-item-meta{font-size:11px;color:var(--text-sub);}
  .day-popup-empty{font-size:12px;color:var(--text-muted);padding:8px 0;}


  /* EXPORT/IMPORT */
  .data-menu-btn{background:none;border:none;color:var(--text-sub);font-size:20px;cursor:pointer;padding:4px;line-height:1;}
  .data-menu{position:fixed;top:56px;right:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px;z-index:25;display:none;flex-direction:column;gap:2px;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .data-menu.open{display:flex;}
  .data-menu-item{font-size:13px;padding:9px 14px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text);cursor:pointer;text-align:left;font-family:inherit;}
  .data-menu-item:hover{background:var(--surface2);}
  .data-menu-item.danger{color:var(--red);}
  .import-input{display:none;}
  /* CHARA MODAL */
  .chara-modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .3s;}
  .chara-modal.show{opacity:1;pointer-events:all;}
  .chara-modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);}
  .chara-modal-inner{position:relative;background:var(--surface);border-radius:20px;padding:28px 24px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:300px;width:90%;transform:scale(.85);transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
  .chara-modal.show .chara-modal-inner{transform:scale(1);}
  .chara-msg{font-size:16px;font-weight:600;text-align:center;line-height:1.4;}
  .chara-sub{font-size:12px;color:var(--text-sub);text-align:center;}
  .chara-close-btn{font-size:13px;padding:8px 24px;border-radius:20px;border:none;background:var(--surface2);color:var(--text);cursor:pointer;margin-top:4px;font-family:inherit;}

  /* CHARA ANIMATIONS */
  .s1-whole{transform-origin:60px 130px;animation:s1nod 2s ease-in-out infinite;}
  @keyframes s1nod{0%,100%{transform:rotate(0)}35%{transform:rotate(-3deg)}65%{transform:rotate(2deg)}}
  .s1-arm-l{transform-origin:34px 105px;animation:s1armL 2s ease-in-out infinite;}
  @keyframes s1armL{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
  .s1-arm-r{transform-origin:86px 105px;animation:s1armR 2s ease-in-out infinite;}
  @keyframes s1armR{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
  .s1-spark{opacity:0;}
  .s1-spark.p1{animation:sparkfloat 2s .1s ease-out infinite;}
  .s1-spark.p2{animation:sparkfloat 2s .7s ease-out infinite;}
  @keyframes sparkfloat{0%{opacity:0;transform:translateY(0) scale(.5)}40%{opacity:1;transform:translateY(-8px) scale(1)}100%{opacity:0;transform:translateY(-18px) scale(.6)}}
  .s2-whole{transform-origin:60px 140px;animation:s2bounce .8s ease-in-out infinite;}
  @keyframes s2bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .s2-arm-r{transform-origin:86px 108px;animation:s2armR .8s ease-in-out infinite;}
  @keyframes s2armR{0%,100%{transform:rotate(0)}50%{transform:rotate(-40deg)}}
  .s2-arm-l{transform-origin:34px 108px;animation:s2armL .8s ease-in-out infinite;}
  @keyframes s2armL{0%,100%{transform:rotate(0)}50%{transform:rotate(15deg)}}
  .s2-spark{opacity:0;}
  .s2-spark.p1{animation:sparkpop .8s 0s ease-out infinite;}
  .s2-spark.p2{animation:sparkpop .8s .25s ease-out infinite;}
  .s2-spark.p3{animation:sparkpop .8s .45s ease-out infinite;}
  @keyframes sparkpop{0%{opacity:0;transform:scale(0)}35%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(.4) translateY(-14px)}}
  .s3-whole{transform-origin:60px 135px;animation:s3crazy 1.6s ease-in-out infinite;}
  @keyframes s3crazy{0%{transform:rotate(0) scale(1)}15%{transform:rotate(-8deg) scale(1.06)}30%{transform:rotate(6deg) scale(1.04)}45%{transform:rotate(-5deg) scale(1.08)}60%{transform:rotate(7deg) scale(1.05)}80%{transform:rotate(-3deg) scale(1.02)}100%{transform:rotate(0) scale(1)}}
  .s3-arm-l{transform-origin:34px 108px;animation:s3armL .8s ease-in-out infinite;}
  @keyframes s3armL{0%,100%{transform:rotate(0)}50%{transform:rotate(-45deg)}}
  .s3-arm-r{transform-origin:86px 108px;animation:s3armR .8s ease-in-out infinite;}
  @keyframes s3armR{0%,100%{transform:rotate(0)}50%{transform:rotate(45deg)}}
  .s3-glow{animation:glowpulse 1.6s ease-in-out infinite;}
  @keyframes glowpulse{0%,100%{opacity:.12;r:50}50%{opacity:.28;r:62}}
  .s3-burst{opacity:0;}
  .s3-burst.q1{animation:burstout 1.6s 0s ease-out infinite;}
  .s3-burst.q2{animation:burstout 1.6s .2s ease-out infinite;}
  .s3-burst.q3{animation:burstout 1.6s .4s ease-out infinite;}
  .s3-burst.q4{animation:burstout 1.6s .6s ease-out infinite;}
  .s3-burst.q5{animation:burstout 1.6s .8s ease-out infinite;}
  @keyframes burstout{0%{opacity:0;transform:scale(0)}30%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(.3) translate(var(--tx,0px),var(--ty,-20px))}}
</style>
</head>
<body>
<div class="nav">
  <div class="nav-title">TaskFlow</div><span id="sync-status" style="font-size:10px;color:var(--text-muted);opacity:0;transition:opacity .5s;"></span>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('active')">タスク</button>
    <button class="nav-tab" onclick="switchTab('habit')">習慣</button>
    <button class="nav-tab" onclick="switchTab('archive')">履歴</button>
  </div>
  <button class="data-menu-btn" onclick="toggleDataMenu()" title="データ管理">⋯</button>
</div>
<div class="data-menu" id="data-menu">
  <button class="data-menu-item" onclick="syncFromCloud()">🔄 今すぐ同期</button>
  <button class="data-menu-item" onclick="exportData()">📤 エクスポート</button>
  <button class="data-menu-item" onclick="document.getElementById('import-input').click()">📥 インポート</button>
  <input type="file" id="import-input" class="import-input" accept=".json" onchange="importData(event)">
</div>
<div class="main">
  <div id="tab-active">
    <div class="heatmap-section">
      <div class="section-label">今月の作業ログ</div>
      <div class="cal-grid" id="heatmap"></div>
      <div class="heatmap-legend">
        <div class="heatmap-legend-cell" style="background:var(--surface)"></div>なし
        <div class="heatmap-legend-cell" style="background:rgba(124,111,255,.5)"></div>作業あり
      </div>
    </div>
    <div class="sort-bar">
      <button class="sort-btn active" onclick="setSort('deadline',event)">締切日順</button>
      <button class="sort-btn" onclick="setSort('start',event)">開始日順</button>
      <button class="sort-btn" onclick="setSort('stars',event)">重要度順</button>
    </div>
    <div class="cards-grid" id="cards-grid"></div>
  </div>
  <div id="tab-habit" style="display:none">
    <div class="heatmap-section">
      <div class="section-label">今月の習慣ログ</div>
      <div class="cal-grid" id="habit-heatmap"></div>
      <div class="heatmap-legend">
        <div class="heatmap-legend-cell" style="background:rgba(45,212,191,.5)"></div>達成
        <div class="heatmap-legend-cell" style="background:rgba(240,96,96,.4);outline:1px solid rgba(240,96,96,.6)"></div>未達成
      </div>
    </div>
    <div class="habit-list" id="habit-list"></div>
  </div>
  <div id="tab-archive" style="display:none">
    <div class="archive-list" id="archive-list"></div>
  </div>
</div>
<button class="fab" id="fab" onclick="onFabClick()">＋</button>
<div class="panel-overlay" id="panel-overlay" onclick="closePanel()"></div>

<!-- TASK PANEL -->
<div class="panel" id="task-panel">
  <div class="panel-handle"></div>
  <div class="panel-inner">
    <div class="panel-header">
      <input class="panel-title-input" id="panel-title" placeholder="タスク名"/>
      <button class="panel-close" onclick="closePanel()">✕</button>
    </div>
    <div class="field-group">
      <div class="field"><div class="field-label">開始日</div><input type="date" id="panel-start"/></div>
      <div class="field"><div class="field-label">締切日</div><input type="date" id="panel-deadline"/></div>
    </div>
    <div class="field" style="margin-bottom:14px">
      <div class="field-label">重要度</div>
      <div class="stars-input" id="stars-input"></div>
    </div>
    <div class="progress-row">
      <div class="progress-label">進捗</div>
      <input type="range" class="progress-slider" id="panel-progress" min="0" max="100" step="5" oninput="document.getElementById('panel-progress-val').textContent=this.value+'%'"/>
      <div class="progress-val" id="panel-progress-val">0%</div>
    </div>
    <hr class="divider">
    <div class="log-section-title">日次ログ<button class="log-add-btn" onclick="showLogForm()">＋ 追加</button></div>
    <div id="log-form-area" style="display:none">
      <div class="log-form">
        <div class="log-time-row">
          <button class="log-time-btn" id="ltb-start" onclick="setLogTime('start')">
            <span class="log-time-btn-label">開始時刻</span>
            <span class="log-time-btn-val" id="ltv-start">タップで記録</span>
          </button>
          <button class="log-time-btn" id="ltb-end" onclick="setLogTime('end')">
            <span class="log-time-btn-label">終了時刻</span>
            <span class="log-time-btn-val" id="ltv-end">タップで記録</span>
          </button>
        </div>
        <input type="text" id="log-duration" placeholder="作業時間メモ（例: 2h30m）" style="font-size:13px"/>
        <textarea id="log-memo-input" placeholder="メモ・進捗" rows="2"></textarea>
        <div class="log-form-actions">
          <button class="btn-sm btn-ghost" onclick="hideLogForm()">キャンセル</button>
          <button class="btn-sm btn-primary" onclick="saveLog()">保存</button>
        </div>
      </div>
    </div>
    <div id="log-list"></div>
    <hr class="divider">
    <div class="field" style="margin-bottom:16px">
      <div class="field-label">所感・メモ</div>
      <textarea id="panel-memo" placeholder="振り返り、気づきなど" rows="3"></textarea>
    </div>
    <div class="panel-actions">
      <button class="btn-delete" onclick="deleteTask()">削除</button>
      <button class="btn-archive" onclick="archiveTask()">完了</button>
      <button class="btn-save" onclick="saveTask()">保存</button>
    </div>
  </div>
</div>

<!-- HABIT PANEL -->
<div class="panel" id="habit-panel">
  <div class="panel-handle"></div>
  <div class="panel-inner">
    <div class="panel-header">
      <input class="panel-title-input" id="habit-panel-title" placeholder="習慣名"/>
      <button class="panel-close" onclick="closePanel()">✕</button>
    </div>
    <div class="field" style="margin-bottom:14px">
      <div class="field-label">アイコン</div>
      <div id="habit-selected-icon" style="font-size:32px;margin-bottom:6px">📚</div>
      <div class="emoji-grid" id="emoji-grid"></div>
    </div>
    <div class="field-group">
      <div class="field"><div class="field-label">単位</div><input type="text" id="habit-unit-input" placeholder="ページ、セット、分"/></div>
      <div class="field"><div class="field-label">目標量（任意）</div><input type="number" id="habit-goal-input" placeholder="例: 30" min="0"/></div>
    </div>
    <div class="field" style="margin-bottom:14px">
      <div class="field-label">目標頻度</div>
      <select id="habit-freq-input">
        <option value="daily">毎日</option>
        <option value="6">週6日</option>
        <option value="5">週5日</option>
        <option value="4">週4日</option>
        <option value="3">週3日</option>
        <option value="2">週2日</option>
        <option value="1">週1日</option>
      </select>
    </div>
    <hr class="divider">
    <div class="log-section-title">記録ログ</div>
    <div id="habit-log-list"></div>
    <hr class="divider">
    <div class="panel-actions">
      <button class="btn-delete" onclick="deleteHabit()">削除</button>
      <button class="btn-archive" onclick="archiveHabit()">完了</button>
      <button class="btn-save-teal" onclick="saveHabit()">保存</button>
    </div>
  </div>
</div>

<script>
// ─── STATE ───────────────────────────────
let tasks=[],habits=[],currentTaskId=null,currentHabitId=null;
let sortMode='deadline',currentTab='active',selectedStars=0,selectedEmoji='📚';
// ─── SUPABASE ────────────────────────────
const SB_URL='https://haedrhepcxpkmqsbztbq.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhZWRyaGVwY3hwa21xc2J6dGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNDk0NzcsImV4cCI6MjEwMTYyNTQ3N30.HBU1BE4oLfSwsv3HPip1ZbW4H2shKrqlyfp4iuYxRj4';
async function sbFetch(path,method='GET',body=null){
  const fetchOpts={
    method,
    headers:{
      'apikey':SB_KEY,
      'Authorization':'Bearer '+SB_KEY,
      'Content-Type':'application/json',
      'Prefer':'resolution=merge-duplicates'
    }
  };
  if(body)fetchOpts.body=JSON.stringify(body);
  const res=await fetch(SB_URL+path,fetchOpts);
  if(!res.ok){const t=await res.text();console.error('Supabase error:',res.status,t);return null;}
  const text=await res.text();
  return text?JSON.parse(text):null;
}
async function syncToCloud(){
  try{
    const taskRows=tasks.map(t=>({id:t.id,data:t,updated_at:new Date().toISOString()}));
    if(taskRows.length)await sbFetch('/rest/v1/tasks','POST',taskRows);
    const habitRows=habits.map(h=>({id:h.id,data:h,updated_at:new Date().toISOString()}));
    if(habitRows.length)await sbFetch('/rest/v1/habits','POST',habitRows);
    showSyncStatus('✓ 同期完了');
  }catch(e){console.error('sync error',e);showSyncStatus('⚠ 同期失敗');}
}
async function syncFromCloud(){
  try{
    showSyncStatus('同期中...');
    const [tRows,hRows]=await Promise.all([
      sbFetch('/rest/v1/tasks?select=id,data,updated_at&order=updated_at.desc','GET'),
      sbFetch('/rest/v1/habits?select=id,data,updated_at&order=updated_at.desc','GET')
    ]);
    if(tRows===null||hRows===null){showSyncStatus('⚠ 同期失敗');return;}
    // merge: クラウド優先（deletedフラグも同期）
    const cloudTaskMap={};
    (tRows||[]).forEach(r=>cloudTaskMap[r.id]={...r.data,_cloudUpdated:r.updated_at});
    const localTaskMap={};
    tasks.forEach(t=>localTaskMap[t.id]=t);
    // クラウドにある→クラウド優先、ローカルのみ→ローカル保持
    const mergedTaskIds=new Set([...Object.keys(cloudTaskMap),...Object.keys(localTaskMap)]);
    tasks=Array.from(mergedTaskIds).map(id=>cloudTaskMap[id]||localTaskMap[id]);

    const cloudHabitMap={};
    (hRows||[]).forEach(r=>cloudHabitMap[r.id]={...r.data,_cloudUpdated:r.updated_at});
    const localHabitMap={};
    habits.forEach(h=>localHabitMap[h.id]=h);
    const mergedHabitIds=new Set([...Object.keys(cloudHabitMap),...Object.keys(localHabitMap)]);
    habits=Array.from(mergedHabitIds).map(id=>cloudHabitMap[id]||localHabitMap[id]);

    saveTasks();saveHabits();
    const tab=localStorage.getItem('taskflow_tab')||'active';
    switchTab(tab,false);
    showSyncStatus('✓ 同期完了');
    // 取得後クラウドにも最新をpush
    await syncToCloud();
  }catch(e){console.error('sync error',e);showSyncStatus('⚠ 同期失敗');}
}
function showSyncStatus(msg){
  let el=document.getElementById('sync-status');
  if(!el)return;
  el.textContent=msg;
  el.style.opacity='1';
  setTimeout(()=>el.style.opacity='0',3000);
}

// 複数クイックログを同時に開けるようにSetで管理
let openQuickLogIds=new Set();
// タスクログフォームの時刻
let logStartTime='',logEndTime='';
const EMOJIS=['📚','💪','🏃','✏️','🎸','🧘','🏊','🎯','💊','🥗','🧹','💰','🖥️','🎨','📝','🌿','🧠','🎮','🚴','📖'];
const FREQ_LABEL={daily:'毎日','6':'週6日','5':'週5日','4':'週4日','3':'週3日','2':'週2日','1':'週1日'};

// ─── STORAGE ─────────────────────────────
function load(){
  tasks=JSON.parse(localStorage.getItem('taskflow_v2')||'[]');
  habits=JSON.parse(localStorage.getItem('taskflow_habits_v1')||'[]');
}
function saveTasks(){localStorage.setItem('taskflow_v2',JSON.stringify(tasks));syncToCloud();}
function saveHabits(){localStorage.setItem('taskflow_habits_v1',JSON.stringify(habits));syncToCloud();}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
// JSTで取得（UTC+9）。朝7時リセット: 0〜6時台は前日扱い
function jstNow(){
  const n=new Date();
  // JSTオフセット: UTC+9
  const jst=new Date(n.getTime()+9*60*60*1000);
  return jst;
}
function today(){
  const jst=jstNow();
  // 0〜6時台は前日扱い
  if(jst.getUTCHours()<7) jst.setUTCDate(jst.getUTCDate()-1);
  return jst.toISOString().slice(0,10);
}
function nowTime(){
  const jst=jstNow();
  return String(jst.getUTCHours()).padStart(2,'0')+':'+String(jst.getUTCMinutes()).padStart(2,'0');
}

// ─── TAB ─────────────────────────────────
function switchTab(tab,save=true){
  currentTab=tab;
  if(save)localStorage.setItem('taskflow_tab',tab);
  ['active','habit','archive'].forEach(t=>document.getElementById('tab-'+t).style.display=t===tab?'':'none');
  document.querySelectorAll('.nav-tab').forEach((el,i)=>el.classList.toggle('active',['active','habit','archive'][i]===tab));
  document.getElementById('fab').style.display=tab==='archive'?'none':'';
  if(tab==='archive')renderArchive();
  if(tab==='habit')renderHabits();
  if(tab==='active')render();
}

// ─── HEATMAP (table layout with month/day labels) ─────────
function buildCalendarGrid(elId, logsPerDate, missedDates, colorClass){
  const todayStr=today();
  const now=jstNow();
  if(now.getUTCHours()<7) now.setUTCDate(now.getUTCDate()-1);
  const year=now.getUTCFullYear(), month=now.getUTCMonth();
  const daysInMonth=new Date(Date.UTC(year,month+1,0)).getUTCDate();
  const firstDow=new Date(Date.UTC(year,month,1)).getUTCDay();
  const DOWS=['日','月','火','水','木','金','土'];
  const totalWeeks=Math.ceil((firstDow+daysInMonth)/7);
  let html='<div class="cal-dow-row">';
  DOWS.forEach((d,i)=>html+=`<div class="cal-dow-cell${i===0?' sun':i===6?' sat':''}">${d}</div>`);
  html+='</div><div class="cal-weeks">';
  for(let w=0;w<totalWeeks;w++){
    html+='<div class="cal-week">';
    for(let dow=0;dow<7;dow++){
      const dayNum=w*7+dow-firstDow+1;
      if(dayNum<1||dayNum>daysInMonth){html+=`<div class="cal-cell other-month"></div>`;continue;}
      const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
      const c=logsPerDate[ds]||0;
      const isPast=ds<todayStr;
      let cls='cal-cell';
      if(dow===0) cls+=' sun-cell';
      if(dow===6) cls+=' sat-cell';
      if(ds===todayStr) cls+=' today-cell';
      if(missedDates&&missedDates[ds]&&isPast) cls+=' missed';
      else if(c>0){
        const lv=c===1?'lv1':c<=3?'lv2':c<=5?'lv3':'lv4';
        cls+=colorClass==='habit'?' h'+lv:' '+lv;
      }
      html+=`<div class="${cls}" onclick="openDayPopup('${ds}')">${dayNum}</div>`;
    }
    html+='</div>';
  }
  html+='</div>';
  document.getElementById(elId).innerHTML=html;
}
function renderHeatmap(){
  const counts={};
  tasks.forEach(t=>(t.logs||[]).forEach(l=>{if(l.date)counts[l.date]=(counts[l.date]||0)+1;}));
  buildCalendarGrid('heatmap',counts,null,'task');
}
function renderHabitHeatmap(){
  const counts={};
  habits.forEach(h=>(h.logs||[]).forEach(l=>{if(l.date)counts[l.date]=(counts[l.date]||0)+1;}));
  // missed dates
  const missed={};
  const now=new Date(),year=now.getFullYear(),month=now.getMonth();
  const daysInMonth=new Date(year,month+1,0).getDate();
  for(let d=1;d<daysInMonth;d++){
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(ds>=today())continue;
    const dow=new Date(ds).getDay();
    let required=false;
    habits.forEach(h=>{
      const freq=h.freq||'daily';
      if(freq==='daily'){required=true;return;}
      const n=parseInt(freq);
      if(n>=6)required=true;
      else if(n>=5&&dow>=1&&dow<=5)required=true;
      else if(n>=4&&[1,2,4,6].includes(dow))required=true;
      else if(n>=3&&[1,3,5].includes(dow))required=true;
      else if(n>=2&&[1,4].includes(dow))required=true;
      else if(n>=1&&dow===1)required=true;
    });
    if(required&&!habits.some(h=>(h.logs||[]).some(l=>l.date===ds)))missed[ds]=true;
  }
  buildCalendarGrid('habit-heatmap',counts,missed,'habit');
}

// ─── TASK CARDS ──────────────────────────
function getStatus(t){if(!t.progress||t.progress==0)return'not-started';if(t.progress>=100)return'done';return'in-progress';}
function getProgressColor(p){if(p>=100)return'var(--green)';if(p>=50)return'var(--accent)';return'var(--amber)';}
function starsHtml(n){return'★'.repeat(n||0)+'☆'.repeat(5-(n||0));}
function setSort(mode,e){sortMode=mode;document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');renderCards();}
function renderCards(){
  const grid=document.getElementById('cards-grid');
  const sorted=[...tasks.filter(t=>!t.archived&&!t.deleted)].sort((a,b)=>{
    if(sortMode==='deadline')return(a.deadline||'9999')<(b.deadline||'9999')?-1:1;
    if(sortMode==='start')return(a.startDate||'9999')<(b.startDate||'9999')?-1:1;
    if(sortMode==='stars')return(b.stars||0)-(a.stars||0);
    return 0;
  });
  if(!sorted.length){grid.style.display='block';grid.innerHTML=`<div class="empty-state"><div class="empty-state-icon">✦</div><p>タスクがまだありません<br>＋ ボタンで追加してください</p></div>`;return;}
  grid.style.display='grid';
  grid.innerHTML=sorted.map(t=>{
    const pct=t.progress||0,status=getStatus(t),color=getProgressColor(pct);
    const sl=status==='not-started'?'未着手':status==='in-progress'?'進行中':'完了';
    return`<div class="task-card" onclick="openTask('${t.id}')"><div class="status-dot ${status}"></div><div class="card-stars">${starsHtml(t.stars)}</div><div class="card-title">${esc(t.title||'無題')}</div><div class="card-dates">${t.startDate||'–'} → ${t.deadline||'–'}</div><div class="card-progress-bg"><div class="card-progress-fill" style="width:${pct}%;background:${color}"></div></div><div class="card-progress-meta"><span>${sl}</span><span>${pct}%</span></div></div>`;
  }).join('');
}

// ─── HABIT CARDS ─────────────────────────
function calcStreak(logs){
  if(!logs||!logs.length)return 0;
  const dates=[...new Set(logs.map(l=>l.date))].sort().reverse();
  let streak=0,cur=new Date(today());
  for(const d of dates){const dd=new Date(d);const diff=Math.round((cur-dd)/86400000);if(diff<=1){streak++;cur=dd;}else break;}
  return streak;
}
function todayLogs(h){return(h.logs||[]).filter(l=>l.date===today());}
function renderHabits(){
  renderHabitHeatmap();
  const el=document.getElementById('habit-list');
  if(!habits.length){el.innerHTML=`<div class="empty-state"><div class="empty-state-icon">🌱</div><p>習慣がまだありません<br>＋ ボタンで追加してください</p></div>`;return;}
  // 未記録を上に、記録済みを下に
  const sorted=[...habits.filter(h=>!h.archived&&!h.deleted)].sort((a,b)=>{
    const aDone=todayLogs(a).length>0;
    const bDone=todayLogs(b).length>0;
    if(aDone&&!bDone)return 1;
    if(!aDone&&bDone)return -1;
    return 0;
  });
  el.innerHTML=sorted.map(h=>{
    const streak=calcStreak(h.logs||[]);
    const tl=todayLogs(h);
    const totalToday=tl.reduce((s,l)=>s+(parseFloat(l.amount)||0),0);
    const hasGoal=h.goal&&parseFloat(h.goal)>0;
    const goalPct=hasGoal?Math.round(totalToday/parseFloat(h.goal)*100):null;
    const isOpen=openQuickLogIds.has(h.id);
    const isDone=tl.length>0;
    const isStarted=!!h._startTime; // 開始時刻が記録されている
    const freqLabel=FREQ_LABEL[h.freq||'daily']||'毎日';
    return`<div>
      <div class="habit-card${isDone?' done-today':isStarted?' started':''}" onclick="toggleQuickLog('${h.id}')">
        <div class="habit-icon">${h.icon||'📚'}</div>
        <div class="habit-info">
          <div class="habit-name">${esc(h.title||'無題')}</div>
          <div class="habit-meta">${freqLabel}${hasGoal?' · 目標 '+h.goal+esc(h.unit||''):''}</div>
          <div class="habit-streak">${streak>0?'🔥 '+streak+'日連続':'記録を始めよう'}</div>
        </div>
        <div class="habit-check-area">
          ${isDone?`<div class="habit-today-val">${totalToday}${esc(h.unit||'')}</div>${hasGoal?`<div style="font-size:10px;color:var(--text-muted)">${goalPct}%</div>`:''}`
            :isStarted?`<div style="font-size:11px;color:var(--amber)">開始 ${h._startTime}</div>`
            :`<div class="habit-today-none">今日未記録</div>`}
          <button class="habit-detail-btn" onclick="event.stopPropagation();openHabitDetail('${h.id}')">詳細</button>
        </div>
      </div>
      <div class="quick-log-form${isOpen?' open':''}" id="qlf-${h.id}">
        ${hasGoal?`<div style="font-size:11px;color:var(--text-muted)">目標: ${h.goal}${esc(h.unit||'')} · 今日: ${totalToday}${esc(h.unit||'')}${goalPct!==null?' ('+goalPct+'%)':''}</div>`:''}
        <div class="ql-time-row">
          <button class="ql-time-btn${h._startTime?' set':''}" onclick="event.stopPropagation();habitSetStart('${h.id}')">
            <span class="ql-time-btn-label">開始</span>
            <span class="ql-time-btn-val">${h._startTime||'タップ'}</span>
          </button>
          <button class="ql-time-btn${h._endTime?' set-end':''}" onclick="event.stopPropagation();habitSetEnd('${h.id}')">
            <span class="ql-time-btn-label">終了 → 記録</span>
            <span class="ql-time-btn-val">${h._endTime||'タップ'}</span>
          </button>
        </div>
        <div class="ql-amount-row${h._endTime?'':' hidden'}" id="ql-amount-row-${h.id}">
          <input class="quick-log-input" type="number" id="ql-amount-${h.id}" placeholder="0" min="0" step="any"/>
          <span class="quick-log-unit">${esc(h.unit||'')}</span>
        </div>
        <textarea class="quick-log-memo" id="ql-memo-${h.id}" placeholder="メモ（任意）" rows="2"></textarea>
        <div class="quick-log-actions">
          <button class="btn-sm btn-ghost" onclick="cancelQuickLog('${h.id}')">キャンセル</button>
          <button class="btn-sm btn-teal" onclick="saveQuickLog('${h.id}')" ${h._endTime?'':'disabled style="opacity:.4"'}>保存</button>
        </div>
      </div>
    </div>`;
  }).join('');
}
function toggleQuickLog(id){
  if(openQuickLogIds.has(id))openQuickLogIds.delete(id);
  else openQuickLogIds.add(id);
  renderHabits();
}
function habitSetStart(id){
  const h=habits.find(x=>x.id===id);if(!h)return;
  h._startTime=nowTime();
  h._endTime='';
  saveHabits();renderHabits();
}
function habitSetEnd(id){
  const h=habits.find(x=>x.id===id);if(!h)return;
  h._endTime=nowTime();
  saveHabits();renderHabits();
  // amountにフォーカス
  setTimeout(()=>{const el=document.getElementById('ql-amount-'+id);if(el)el.focus();},100);
}
function cancelQuickLog(id){
  const h=habits.find(x=>x.id===id);if(!h)return;
  h._startTime='';h._endTime='';
  saveHabits();
  openQuickLogIds.delete(id);
  renderHabits();
}
function saveQuickLog(id){
  const h=habits.find(x=>x.id===id);if(!h)return;
  const amount=document.getElementById('ql-amount-'+id).value;
  const memo=document.getElementById('ql-memo-'+id).value;
  if(!amount)return;
  if(!h.logs)h.logs=[];
  h.logs.unshift({id:genId(),date:today(),amount,startTime:h._startTime||'',endTime:h._endTime||'',memo});
  h._startTime='';h._endTime='';
  saveHabits();
  // achievement check
  const hasGoal=h.goal&&parseFloat(h.goal)>0;
  if(hasGoal){
    const totalToday=(h.logs||[]).filter(l=>l.date===today()).reduce((s,l)=>s+(parseFloat(l.amount)||0),0);
    const goalPct=Math.round(totalToday/parseFloat(h.goal)*100);
    if(goalPct>=100)showCharaModal(goalPct);
  }
  openQuickLogIds.delete(id);
  renderHabits();
}

// ─── EMOJI ───────────────────────────────
function renderEmojiGrid(){
  document.getElementById('emoji-grid').innerHTML=EMOJIS.map(e=>`<button class="emoji-opt${e===selectedEmoji?' selected':''}" onclick="selectEmoji('${e}')">${e}</button>`).join('');
}
function selectEmoji(e){selectedEmoji=e;document.getElementById('habit-selected-icon').textContent=e;renderEmojiGrid();}

// ─── PANEL ───────────────────────────────
function openPanel(id){document.getElementById('panel-overlay').classList.add('open');document.getElementById(id).classList.add('open');}
function closePanel(){
  document.getElementById('panel-overlay').classList.remove('open');
  document.getElementById('task-panel').classList.remove('open');
  document.getElementById('habit-panel').classList.remove('open');
  currentTaskId=null;currentHabitId=null;
}
function onFabClick(){if(currentTab==='habit')openNewHabit();else openNewTask();}

// ─── TASK PANEL ──────────────────────────
function openNewTask(){
  currentTaskId=null;
  document.getElementById('panel-title').value='';
  document.getElementById('panel-start').value='';
  document.getElementById('panel-deadline').value='';
  document.getElementById('panel-progress').value=0;
  document.getElementById('panel-progress-val').textContent='0%';
  document.getElementById('panel-memo').value='';
  renderStarsInput(0);renderLogList([]);hideLogForm();
  openPanel('task-panel');
}
function openTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  currentTaskId=id;
  document.getElementById('panel-title').value=t.title||'';
  document.getElementById('panel-start').value=t.startDate||'';
  document.getElementById('panel-deadline').value=t.deadline||'';
  document.getElementById('panel-progress').value=t.progress||0;
  document.getElementById('panel-progress-val').textContent=(t.progress||0)+'%';
  document.getElementById('panel-memo').value=t.memo||'';
  renderStarsInput(t.stars||0);renderLogList(t.logs||[]);hideLogForm();
  openPanel('task-panel');
}
function saveTask(){
  const title=document.getElementById('panel-title').value.trim()||'無題';
  const startDate=document.getElementById('panel-start').value;
  const deadline=document.getElementById('panel-deadline').value;
  const progress=parseInt(document.getElementById('panel-progress').value);
  const memo=document.getElementById('panel-memo').value;
  if(currentTaskId){const t=tasks.find(x=>x.id===currentTaskId);if(t){t.title=title;t.startDate=startDate;t.deadline=deadline;t.progress=progress;t.memo=memo;t.stars=selectedStars;}}
  else tasks.push({id:genId(),title,startDate,deadline,progress,memo,stars:selectedStars,logs:[],archived:false,createdAt:new Date().toISOString()});
  saveTasks();render();closePanel();
}
function deleteTask(){if(!currentTaskId)return;if(!confirm('このタスクを削除しますか？'))return;const t=tasks.find(x=>x.id===currentTaskId);if(t){t.deleted=true;}saveTasks();render();closePanel();}
function archiveTask(){if(!currentTaskId)return;saveTask();const t=tasks.find(x=>x.id===currentTaskId);if(t){t.archived=true;t.progress=100;}saveTasks();render();}
function renderStarsInput(val){
  selectedStars=val||0;
  document.getElementById('stars-input').innerHTML=[1,2,3,4,5].map(i=>`<button class="star-btn ${i<=selectedStars?'active':''}" onclick="setStars(${i})">★</button>`).join('');
}
function setStars(n){selectedStars=selectedStars===n?0:n;renderStarsInput(selectedStars);}

// ─── TASK LOG ────────────────────────────
function showLogForm(){
  logStartTime='';logEndTime='';
  document.getElementById('log-duration').value='';
  document.getElementById('log-memo-input').value='';
  updateLogTimeBtns();
  document.getElementById('log-form-area').style.display='';
}
function hideLogForm(){document.getElementById('log-form-area').style.display='none';}
function setLogTime(which){
  const t=nowTime();
  if(which==='start'){logStartTime=t;}
  else{logEndTime=t;}
  updateLogTimeBtns();
}
function updateLogTimeBtns(){
  const sb=document.getElementById('ltb-start');
  const eb=document.getElementById('ltb-end');
  const sv=document.getElementById('ltv-start');
  const ev=document.getElementById('ltv-end');
  if(sb&&sv){sb.className='log-time-btn'+(logStartTime?' set':'');sv.textContent=logStartTime||'タップで記録';}
  if(eb&&ev){eb.className='log-time-btn'+(logEndTime?' set-end':'');ev.textContent=logEndTime||'タップで記録';}
}
function saveLog(){
  const duration=document.getElementById('log-duration').value;
  const memo=document.getElementById('log-memo-input').value;
  const date=today();
  let t;
  if(currentTaskId){t=tasks.find(x=>x.id===currentTaskId);}
  else{saveTask();t=tasks[tasks.length-1];currentTaskId=t.id;}
  if(!t.logs)t.logs=[];
  t.logs.unshift({id:genId(),date,startTime:logStartTime,endTime:logEndTime,duration,memo});
  saveTasks();renderLogList(t.logs);renderHeatmap();hideLogForm();
}
function deleteLog(logId){const t=tasks.find(x=>x.id===currentTaskId);if(!t)return;t.logs=t.logs.filter(l=>l.id!==logId);saveTasks();renderLogList(t.logs);renderHeatmap();}
function renderLogList(logs){
  const el=document.getElementById('log-list');
  if(!logs||!logs.length){el.innerHTML='<div style="font-size:12px;color:var(--text-muted);padding:8px 0">ログはまだありません</div>';return;}
  el.innerHTML=logs.map(l=>`<div class="log-item"><div class="log-item-header"><span class="log-date-badge">${l.date}</span><span class="log-time">${l.startTime?l.startTime+(l.endTime?' – '+l.endTime:''):''}${l.duration?' ('+l.duration+')':''}</span><button class="log-delete-btn" onclick="deleteLog('${l.id}')">✕</button></div>${l.memo?`<div class="log-memo">${esc(l.memo)}</div>`:''}</div>`).join('');
}

function openHabitDetail(id){
  const h=habits.find(x=>x.id===id);if(!h)return;
  currentHabitId=id;
  document.getElementById('habit-panel-title').value=h.title||'';
  document.getElementById('habit-unit-input').value=h.unit||'';

function saveHabit(){
  const title=document.getElementById('habit-panel-title').value.trim()||'無題';
  const unit=document.getElementById('habit-unit-input').value.trim();
  const goal=document.getElementById('habit-goal-input').value;
  const freq=document.getElementById('habit-freq-input').value;
  if(currentHabitId){const h=habits.find(x=>x.id===currentHabitId);if(h){h.title=title;h.unit=unit;h.goal=goal;h.freq=freq;h.icon=selectedEmoji;}}
  else habits.push({id:genId(),title,unit,goal,freq,icon:selectedEmoji,logs:[]});
  saveHabits();renderHabits();closePanel();
}
function deleteHabit(){if(!currentHabitId)return;if(!confirm('この習慣を削除しますか？'))return;const h=habits.find(x=>x.id===currentHabitId);if(h){h.deleted=true;}saveHabits();renderHabits();closePanel();}
function archiveHabit(){if(!currentHabitId)return;const h=habits.find(x=>x.id===currentHabitId);if(h){h.archived=true;}saveHabits();renderHabits();closePanel();}
function renderHabitLogList(logs,unit){
  const el=document.getElementById('habit-log-list');
  if(!logs||!logs.length){el.innerHTML='<div style="font-size:12px;color:var(--text-muted);padding:8px 0">ログはまだありません</div>';return;}

}
function deleteHabitLog(logId){const h=habits.find(x=>x.id===currentHabitId);if(!h)return;h.logs=h.logs.filter(l=>l.id!==logId);saveHabits();renderHabitLogList(h.logs,h.unit||'');renderHabits();}

// ─── DAY POPUP ───────────────────────────
function openDayPopup(ds){
  const d=new Date(ds+'T00:00:00');
  const label=`${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`;
  document.getElementById('day-popup-title').textContent=label;
  let html='';
  // タスクログ
  const taskLogs=[];
  tasks.forEach(t=>{
    const logs=(t.logs||[]).filter(l=>l.date===ds);
    if(logs.length)taskLogs.push({task:t,logs});
  });
  html+=`<div class="day-popup-section">タスク</div>`;
  if(taskLogs.length){
    taskLogs.forEach(({task:t,logs})=>{
      const pct=t.progress||0;
      html+=`<div class="day-popup-item"><div class="day-popup-item-title">${esc(t.title||'無題')} <span style="font-size:11px;color:${pct>=100?'var(--green)':pct>=50?'var(--accent)':'var(--amber)'}">${pct}%</span></div>`;
      logs.forEach(l=>html+=`<div class="day-popup-item-meta">${l.startTime?l.startTime+(l.endTime?' – '+l.endTime:''):''}${l.duration?' ('+l.duration+')':''}${l.memo?' · '+esc(l.memo):''}</div>`);
      html+=`</div>`;
    });
  } else html+=`<div class="day-popup-empty">この日のタスクログなし</div>`;
  // 習慣ログ
  const habitLogs=[];
  habits.forEach(h=>{
    const logs=(h.logs||[]).filter(l=>l.date===ds);
    if(logs.length)habitLogs.push({habit:h,logs});
  });
  html+=`<div class="day-popup-section">習慣</div>`;
  if(habitLogs.length){
    habitLogs.forEach(({habit:h,logs})=>{
      const total=logs.reduce((s,l)=>s+(parseFloat(l.amount)||0),0);
      html+=`<div class="day-popup-item"><div class="day-popup-item-title">${h.icon||''} ${esc(h.title||'無題')} <span style="font-size:11px;color:var(--teal)">${total}${esc(h.unit||'')}</span></div>`;
      logs.forEach(l=>html+=`<div class="day-popup-item-meta">${l.startTime?l.startTime+(l.endTime?' – '+l.endTime:''):''}${l.memo?' · '+esc(l.memo):''}</div>`);
      html+=`</div>`;
    });
  } else html+=`<div class="day-popup-empty">この日の習慣ログなし</div>`;
  document.getElementById('day-popup-content').innerHTML=html;
  document.getElementById('day-popup-overlay').classList.add('show');
}
function closeDayPopup(){document.getElementById('day-popup-overlay').classList.remove('show');}

// ─── ARCHIVE ─────────────────────────────
function renderArchive(){
  const archivedTasks=tasks.filter(t=>t.archived&&!t.deleted);
  const archivedHabits=habits.filter(h=>h.archived&&!h.deleted);
  const el=document.getElementById('archive-list');
  if(!archivedTasks.length&&!archivedHabits.length){el.innerHTML=`<div class="empty-state"><div class="empty-state-icon">✦</div><p>アーカイブはまだありません</p></div>`;return;}
  let html='';
  if(archivedTasks.length){
    html+=`<div style="font-size:11px;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;padding:16px 0 8px">タスク</div>`;
    html+=archivedTasks.map(t=>`<div class="archive-item" onclick="openTask('${t.id}')"><div class="archive-item-header"><div class="archive-item-title">${esc(t.title||'無題')}</div><span class="archive-badge">完了</span></div><div class="archive-item-meta">${t.startDate||'–'} → ${t.deadline||'–'} · ${starsHtml(t.stars)}</div>${t.memo?`<div class="archive-item-memo">${esc(t.memo)}</div>`:''}</div>`).join('');
  }
  if(archivedHabits.length){
    html+=`<div style="font-size:11px;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;padding:16px 0 8px">習慣</div>`;
    html+=archivedHabits.map(h=>{
      const total=(h.logs||[]).length;
      const streak=calcStreak(h.logs||[]);
      return`<div class="archive-item" onclick="openHabitDetail('${h.id}')"><div class="archive-item-header"><div class="archive-item-title">${h.icon||''} ${esc(h.title||'無題')}</div><span class="archive-badge" style="background:var(--teal-bg);color:var(--teal)">習慣</span></div><div class="archive-item-meta">記録 ${total}回 · 最長 ${streak}日連続 · ${FREQ_LABEL[h.freq||'daily']||'毎日'}</div></div>`;
    }).join('');
  }
  el.innerHTML=html;
}


// ─── EXPORT / IMPORT ─────────────────────
function toggleDataMenu(){
  const m=document.getElementById('data-menu');
  m.classList.toggle('open');
}
document.addEventListener('click',function(e){
  const menu=document.getElementById('data-menu');
  if(menu&&menu.classList.contains('open')&&!menu.contains(e.target)&&!e.target.classList.contains('data-menu-btn')){
    menu.classList.remove('open');
  }
});
function exportData(){
  document.getElementById('data-menu').classList.remove('open');
  const data={tasks,habits,exportedAt:new Date().toISOString(),version:2};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const d=new Date();
  a.download=`taskflow_backup_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importData(e){
  document.getElementById('data-menu').classList.remove('open');
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.tasks&&!data.habits){alert('形式が正しくありません');return;}
      if(!confirm(`インポートします。\nタスク: ${(data.tasks||[]).length}件\n習慣: ${(data.habits||[]).length}件\n\n現在のデータに追加されます。続けますか？`))return;
      // 既存データとマージ（IDが重複しないよう追加）
      const existingTaskIds=new Set(tasks.map(t=>t.id));
      const existingHabitIds=new Set(habits.map(h=>h.id));
      (data.tasks||[]).forEach(t=>{if(!existingTaskIds.has(t.id))tasks.push(t);});
      (data.habits||[]).forEach(h=>{if(!existingHabitIds.has(h.id))habits.push(h);});
      saveTasks();saveHabits();
      render();
      alert('インポート完了しました！');
    }catch(err){alert('ファイルの読み込みに失敗しました');}
  };
  reader.readAsText(file);
  e.target.value='';
}

function render(){renderHeatmap();renderCards();}
load();
const _savedTab=localStorage.getItem('taskflow_tab')||'active';
switchTab(_savedTab,false);
// 起動時にクラウドと同期
syncFromCloud();

// ─── SERVICE WORKER ──────────────────────
if('serviceWorker' in navigator){
  const swCode=`
const CACHE='taskflow-v1';
const ASSETS=['./'];
self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS))));
self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k))))));
self.addEventListener('fetch',e=>{
  if(e.request.url.includes('supabase.co'))return;
  e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{
    if(!res||res.status!==200||res.type!=='basic')return res;
    const clone=res.clone();
    caches.open(CACHE).then(c=>c.put(e.request,clone));
    return res;
  })));
});
  `;
  const blob=new Blob([swCode],{type:'application/javascript'});
  const swUrl=URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl,{scope:'./'}).then(()=>{
    console.log('SW registered');
  }).catch(e=>console.log('SW registration failed:',e));
}
